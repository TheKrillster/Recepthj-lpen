name: Bygg APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Packa upp senaste projektet
        run: |
          ZIP=$(git log --format= --name-only --diff-filter=AM -- '*.zip' | grep -m1 .)
          echo "Använder: $ZIP"
          if [ -n "$ZIP" ] && [ -f "$ZIP" ]; then
            unzip -q -o "$ZIP" -d projekt
            S=$(find projekt -name settings.gradle.kts -not -path '*/build/*' | head -1)
            echo "PROJ=$(dirname "$S")" >> $GITHUB_ENV
          else
            echo "PROJ=." >> $GITHUB_ENV
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Bygg
        working-directory: ${{ env.PROJ }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Döp om APK
        run: cp "${{ env.PROJ }}/app/build/outputs/apk/release/app-release.apk" Recepthjalpen-${{ github.run_number }}.apk

      - name: Publicera release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Recepthjälpen 1.0.${{ github.run_number }}
          files: Recepthjalpen-${{ github.run_number }}.apk
          make_latest: true
